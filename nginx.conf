server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Include standard MIME types and register 3D model formats for Three.js
    include /etc/nginx/mime.types;
    types {
        model/gltf-binary              glb;
        model/gltf+json                gltf;
        application/octet-stream       bin;
    }

    # Gzip Compression for text, scripts, stylesheets and 3D JSON
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/wasm
        application/x-javascript
        application/xml
        font/woff
        font/woff2
        image/svg+xml
        model/gltf+json
        text/css
        text/javascript
        text/plain
        text/xml;

    # SPA Fallback: Serve static file or fallback to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Immutable hashed static assets generated by Vite in /assets/
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # 3D assets, textures, and static imagery (MODIS/VIIRS GLBs, Blue Marble textures)
    location ~* \.(?:glb|gltf|bin|jpg|jpeg|png|webp|svg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Entry HTML: Ensure fresh versions are retrieved immediately on deployment
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        expires 0;
    }

    # Custom 50x error page
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
